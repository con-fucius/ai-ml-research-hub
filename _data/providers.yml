- id: "google"
  name: "Google DeepMind"
  description: "Inventors of the Transformer, pioneering multimodal Gemini systems."
  icon: "google"
  timeline:
    - date: "2017-06"
      model: "Transformer (Paper)"
      type: "Architecture"
      specs: "Attention Is All You Need"
      description: "The foundational architecture for all modern LLMs."
    - date: "2018-10"
      model: "BERT"
      type: "Encoder"
      specs: "340M Params"
      description: "Bidirectional Encoder Representations from Transformers; foundational for NLP."
    - date: "2023-12"
      model: "Gemini Pro / Ultra"
      type: "Multimodal"
      specs: "v1.0"
      description: "First major Google multimodal LLMs built from the start for diverse inputs."
    - date: "2024-02"
      model: "Gemini 1.5 Pro"
      type: "Long Context"
      specs: "1M+ Context"
      description: "Massive context window breakthrough with near-perfect needle retrieval."
    - date: "2024-05"
      model: "Veo"
      type: "Video"
      specs: "Text-to-Long-Video"
      description: "Generative video model for long-form content, later integrating native audio."
    - date: "2024-12"
      model: "Gemini 2.0 Flash"
      type: "Multimodal"
      specs: "Low Latency / Native Tool Use"
      description: "Experimental release of the first Gemini 2.0 family model, optimized for speed and tool calling."
    - date: "2025-03"
      model: "Gemini 2.5 Pro"
      type: "Reasoning"
      specs: "Thinking / 1M Context"
      description: "Reasoning-focused Gemini model with long context and improved coding performance."
    - date: "2025-09"
      model: "VaultGemma / Nested Learning"
      type: "Privacy & Continual learning"
      specs: "Research Breakthrough"
      description: "Launch of the largest privacy-centric open model and the Nested Learning paradigm."
    - date: "2025-11"
      model: "Gemini 3 Pro / Flash"
      type: "Omni"
      specs: "1M token context"
      description: "Latest Google flagship multimodal LLM with hyper-efficient Flash variants."
    - date: "2025"
      model: "Imagen 4"
      type: "Image"
      specs: "Photorealistic"
      description: "The latest text-to-image series with unprecedented fidelity and prompt adherence."

